[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crooked-numbers-analytics"
version = "0.1.0"
description = "Research and analytics tools for the Crooked Numbers baseball project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19,<2",
    "duckdb>=1.4,<2",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
